<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <p class="subtitle">Welcome to your dashboard</p>
  </div>

  <div class="user-info-card" *ngIf="currentUser$ | async as user">
    <div class="card-header">
      <h2>Profile Information</h2>
    </div>
    <div class="card-body">
      <div class="info-grid">
        <div class="info-item">
          <label>Full Name:</label>
          <p class="value">{{ user.name }}</p>
        </div>
        <div class="info-item">
          <label>Username:</label>
          <p class="value">{{ user.username }}</p>
        </div>
        <div class="info-item">
          <label>Email:</label>
          <p class="value">{{ user.email }}</p>
        </div>
        <div class="info-item">
          <label>User ID:</label>
          <p class="value">{{ user.id }}</p>
        </div>
        <div class="info-item">
          <label>Role:</label>
          <p class="value badge">{{ user.role }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="quick-stats">
    <div class="stat-card">
      <div class="stat-icon">👤</div>
      <div class="stat-content">
        <p class="stat-label">Account Status</p>
        <p class="stat-value">Active</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔐</div>
      <div class="stat-content">
        <p class="stat-label">Security</p>
        <p class="stat-value">Secured</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">✅</div>
      <div class="stat-content">
        <p class="stat-label">Status</p>
        <p class="stat-value">Logged In</p>
      </div>
    </div>
  </div>

  <div class="actions-section">
    <h3>Quick Actions</h3>
    <div class="button-group">
      <button class="btn btn-secondary">Edit Profile</button>
      <button class="btn btn-secondary">Change Password</button>
      <button class="btn btn-secondary">Settings</button>
    </div>
  </div>
</div>
