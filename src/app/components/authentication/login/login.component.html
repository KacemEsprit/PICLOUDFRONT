<!-- Include Navbar -->
<app-header></app-header>

<!-- ============================================================
     LOGIN PAGE — Professional Template
     ============================================================ -->
<div class="auth-wrapper">
  <div class="auth-section">
    <div class="auth-form-wrapper">
      <div class="auth-card">
        <!-- Card Header -->
        <div class="auth-card-header">
          <h2>Welcome Back</h2>
          <p>Sign in to your account to continue</p>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active">Sign In</button>
        </div>

        <!-- Login Form -->
        <div class="auth-form">
          <!-- Error Alert -->
          <div *ngIf="error" class="alert alert-error">
            <span class="alert-icon">⚠️</span>
            <span>{{ error }}</span>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <!-- Username -->
            <div class="auth-form-group">
              <label for="username" class="auth-label">Email or Username</label>
              <div class="auth-input-wrapper">
                <input
                  id="username"
                  type="text"
                  class="auth-input"
                  formControlName="username"
                  placeholder="Enter your email or username"
                  [ngClass]="{'error': submitted && f['username'].errors}" />
              </div>
              <div *ngIf="submitted && f['username'].errors" class="auth-error-msg">
                Username is required
              </div>
            </div>

            <!-- Password -->
            <div class="auth-form-group">
              <label for="password" class="auth-label">Password</label>
              <div class="auth-input-wrapper">
                <input
                  id="password"
                  [type]="showPassword ? 'text' : 'password'"
                  class="auth-input"
                  formControlName="password"
                  placeholder="Enter your password"
                  [ngClass]="{'error': submitted && f['password'].errors}" />
                <button
                  type="button"
                  class="password-toggle"
                  (click)="togglePasswordVisibility()"
                  tabindex="-1">
                  <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
              </div>
              <div *ngIf="submitted && f['password'].errors" class="auth-error-msg">
                Password is required
              </div>
            </div>

            <!-- Forgot Password Link -->
            <div class="forgot-link">
              <a routerLink="/forgot-password">Forgot your password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-auth" [disabled]="loading">
              {{ loading ? 'Signing in...' : 'Sign In' }}
            </button>
          </form>

          <!-- Sign Up Link -->
          <div class="auth-bottom-text">
            Don't have an account? <a routerLink="/register">Sign up</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Include Footer -->
<app-footer></app-footer>
