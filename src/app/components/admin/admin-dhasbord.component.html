<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Admin Dhasbord</h1>
    <p class="subtitle">Welcome to your admin dashboard</p>
  </div>

  <div class="user-info-card" *ngIf="currentUser$ | async as user">
    <div class="card-header">
      <h2>Profile Information</h2>
    </div>
    <div class="card-body">
      <div class="info-grid">
        <div class="info-item">
          <label>Full Name:</label>
          <p class="value">{{ user.name }}</p>
        </div>
        <div class="info-item">
          <label>Username:</label>
          <p class="value">{{ user.username }}</p>
        </div>
        <div class="info-item">
          <label>Email:</label>
          <p class="value">{{ user.email }}</p>
        </div>
        <div class="info-item">
          <label>User ID:</label>
          <p class="value">{{ user.id }}</p>
        </div>
        <div class="info-item">
          <label>Role:</label>
          <p class="value badge">{{ user.role }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="admin-action-card" *ngIf="currentUser?.role === 'ADMIN'">
    <h3>Admin Tools</h3>
    <p>Access management tools for the application.</p>
    <div class="button-group">
      <a class="btn btn-primary" routerLink="/admin-dhasbord/users">Manage Users</a>
      <a class="btn btn-primary" routerLink="/admin/documents">Manage Documents</a>
    </div>
  </div>
</div>
