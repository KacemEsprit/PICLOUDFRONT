<div class="card">
  <div class="card-header">
    <h3 class="card-title">
      {{ isEditMode ? 'Edit Contract' : 'Add Contract' }}
    </h3>
  </div>
  <div class="card-body">
    <form (ngSubmit)="save()">

      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label>Contract Type *</label>
            <select class="form-control"
                    [(ngModel)]="contract.contractType"
                    name="contractType">
              <option value="COMMERCIAL">COMMERCIAL</option>
              <option value="TECHNICAL">TECHNICAL</option>
              <option value="INSTITUTIONAL">INSTITUTIONAL</option>
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label>Status *</label>
            <select class="form-control"
                    [(ngModel)]="contract.status"
                    name="status">
              <option value="DRAFT">DRAFT</option>
              <option value="ACTIVE">ACTIVE</option>
              <option value="EXPIRED">EXPIRED</option>
              <option value="TERMINATED">TERMINATED</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label>Start Date *</label>
            <input type="date" class="form-control"
                   [(ngModel)]="contract.startDate"
                   name="startDate" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label>End Date *</label>
            <input type="date" class="form-control"
                   [(ngModel)]="contract.endDate"
                   name="endDate" required>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label>Organization ID *</label>
            <input type="number" class="form-control"
                   [(ngModel)]="contract.organizationId"
                   name="organizationId" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label>Partner ID *</label>
            <input type="number" class="form-control"
                   [(ngModel)]="contract.partnerId"
                   name="partnerId" required>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div class="form-group">
            <label>Description</label>
            <textarea class="form-control" rows="3"
                      [(ngModel)]="contract.description"
                      name="description"></textarea>
          </div>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-12">
          <button type="submit" class="btn btn-primary mr-2">
            <i class="fas fa-save"></i>
            {{ isEditMode ? 'Update' : 'Save' }}
          </button>
          <a routerLink="/contracts" class="btn btn-secondary">
            <i class="fas fa-times"></i> Cancel
          </a>
        </div>
      </div>

    </form>
  </div>
</div>
