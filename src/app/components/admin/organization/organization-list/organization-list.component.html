<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h3 class="card-title">Organizations</h3>
    <a routerLink="/admin/organizations/new" class="btn btn-primary btn-sm">
      <i class="fas fa-plus"></i> Add Organization
    </a>
  </div>

  <!-- Filters -->
  <div style="padding:15px 20px; background:#f8f9ff; border-bottom:1px solid #f0f2f5;">
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">

      <div style="position:relative; flex:2; min-width:200px;">
        <i class="fas fa-search" style="position:absolute; left:12px; top:50%;
           transform:translateY(-50%); color:#bbb; font-size:0.8rem;
           z-index:0; pointer-events:none;"></i>
        <input type="text" class="form-control"
               [(ngModel)]="searchTerm"
               (ngModelChange)="applyFilters()"
               placeholder="Search by name, email, acronyme..."
               style="padding-left:38px; height:38px; position:relative; z-index:1; background:transparent;">
      </div>

      <div style="flex:1; min-width:130px;">
        <select class="form-control"
                [(ngModel)]="filterStatus"
                (ngModelChange)="applyFilters()"
                style="height:38px;">
          <option value="">All Status</option>
          <option value="ACTIVE">ACTIVE</option>
          <option value="INACTIVE">INACTIVE</option>
          <option value="SUSPENDED">SUSPENDED</option>
        </select>
      </div>

      <div style="flex:1; min-width:130px;">
        <select class="form-control"
                [(ngModel)]="filterType"
                (ngModelChange)="applyFilters()"
                style="height:38px;">
          <option value="">All Types</option>
          <option value="PUBLIC">PUBLIC</option>
          <option value="PRIVATE">PRIVATE</option>
          <option value="MIXED">MIXED</option>
        </select>
      </div>

      <button (click)="clearFilters()"
              style="height:38px; width:38px; border:1px solid #ddd;
                     background:white; border-radius:8px; cursor:pointer;
                     display:flex; align-items:center; justify-content:center;
                     color:#666; flex-shrink:0;"
              title="Clear filters">
        <i class="fas fa-times"></i>
      </button>

    </div>
    <small class="text-muted" style="display:block; margin-top:8px;">
      Showing {{ filteredOrganizations.length }} of {{ organizations.length }} organizations
    </small>
  </div>

  <div class="card-body p-0">
    <table class="table table-striped table-hover">
      <thead>
      <tr>
        <th>Name</th>
        <th>Acronyme</th>
        <th>Email</th>
        <th>Type</th>
        <th>Status</th>
        <th>Coverage</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let org of paginatedOrganizations">
        <td>{{ org.name }}</td>
        <td>{{ org.acronyme }}</td>
        <td>{{ org.email }}</td>
        <td>
          <span class="badge"
                [class.badge-primary]="org.type === 'PUBLIC'"
                [class.badge-warning]="org.type === 'PRIVATE'"
                [class.badge-info]="org.type === 'MIXED'">
            {{ org.type }}
          </span>
        </td>
        <td>
          <span class="badge"
                [class.badge-success]="org.status === 'ACTIVE'"
                [class.badge-danger]="org.status === 'INACTIVE'"
                [class.badge-warning]="org.status === 'SUSPENDED'">
            {{ org.status }}
          </span>
        </td>
        <td>{{ org.coverageType }}</td>
        <td>
          <a [routerLink]="['/admin/organizations/edit', org.id]"
             class="btn btn-warning btn-sm mr-1">
            <i class="fas fa-edit"></i>
          </a>
          <a [routerLink]="['/admin/organizations', org.id]"
             class="btn btn-info btn-sm mr-1"
             title="View Partners">
            <i class="fas fa-eye"></i>
          </a>
          <button (click)="delete(org.id!)"
                  class="btn btn-danger btn-sm">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>
      <tr *ngIf="paginatedOrganizations.length === 0">
        <td colspan="7" class="text-center text-muted py-4">
          <i class="fas fa-search" style="font-size:2rem; display:block; margin-bottom:10px;"></i>
          No organizations found
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="card-footer">
    <app-pagination
      [currentPage]="currentPage"
      [totalItems]="filteredOrganizations.length"
      [itemsPerPage]="itemsPerPage"
      (pageChanged)="updatePage($event)">
    </app-pagination>
  </div>
</div>
