<div class="card">
  <div class="card-header">
    <h3 class="card-title">
      {{ isEditMode ? 'Edit Organization' : 'Add Organization' }}
    </h3>
  </div>
  <div class="card-body">
    <form (ngSubmit)="save()">

      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label>Name *</label>
            <input type="text" class="form-control"
                   [(ngModel)]="organization.name"
                   name="name" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label>Acronyme *</label>
            <input type="text" class="form-control"
                   [(ngModel)]="organization.acronyme"
                   name="acronyme" required>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label>Email *</label>
            <input type="email" class="form-control"
                   [(ngModel)]="organization.email"
                   name="email" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="text" class="form-control"
                   [(ngModel)]="organization.phoneNumber"
                   name="phoneNumber" required
                   placeholder="+21671000000">
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label>Transport Type *</label>
            <input type="text" class="form-control"
                   [(ngModel)]="organization.transportType"
                   name="transportType" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label>Website</label>
            <input type="text" class="form-control"
                   [(ngModel)]="organization.website"
                   name="website">
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label>Type *</label>
            <select class="form-control"
                    [(ngModel)]="organization.type" name="type">
              <option value="PUBLIC">PUBLIC</option>
              <option value="PRIVATE">PRIVATE</option>
              <option value="MIXED">MIXED</option>
            </select>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label>Status *</label>
            <select class="form-control"
                    [(ngModel)]="organization.status" name="status">
              <option value="ACTIVE">ACTIVE</option>
              <option value="INACTIVE">INACTIVE</option>
              <option value="SUSPENDED">SUSPENDED</option>
            </select>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label>Coverage Type *</label>
            <select class="form-control"
                    [(ngModel)]="organization.coverageType" name="coverageType">
              <option value="BUS">BUS</option>
              <option value="TRAIN">TRAIN</option>
              <option value="METRO">METRO</option>
              <option value="LOUAGE">LOUAGE</option>
              <option value="BATAH">BATAH</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Map Picker -->
      <div class="row mt-3">
        <div class="col-12">
          <div class="form-group">
            <label>📍 Organization Location</label>
            <app-map-picker
              (locationSelected)="onLocationSelected($event)">
            </app-map-picker>
          </div>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-12">
          <button type="submit" class="btn btn-primary mr-2">
            <i class="fas fa-save"></i>
            {{ isEditMode ? 'Update' : 'Save' }}
          </button>
          <a routerLink="/admin/organizations" class="btn btn-secondary">
            <i class="fas fa-times"></i> Cancel
          </a>
        </div>
      </div>

    </form>
  </div>
</div>
