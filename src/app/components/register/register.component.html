<div class="register-container">
  <div class="register-box">
    <h2>Register</h2>

    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>

    <div *ngIf="success" class="alert alert-success">
      {{ success }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Username -->
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          class="form-control"
          formControlName="username"
          [class.is-invalid]="submitted && f['username'].errors"
          placeholder="Choose a username"
        />
        <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">
          <div *ngIf="f['username'].errors['required']">Username is required</div>
          <div *ngIf="f['username'].errors['minlength']">Username must be at least 3 characters</div>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          formControlName="email"
          [class.is-invalid]="submitted && f['email'].errors"
          placeholder="Enter your email"
        />
        <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
          <div *ngIf="f['email'].errors['required']">Email is required</div>
          <div *ngIf="f['email'].errors['email']">Please enter a valid email</div>
        </div>
      </div>

      <!-- Name -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          class="form-control"
          formControlName="name"
          [class.is-invalid]="submitted && f['name'].errors"
          placeholder="Enter your full name"
        />
        <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
          <div *ngIf="f['name'].errors['required']">Full name is required</div>
        </div>
      </div>

      <!-- CIN -->
      <div class="form-group">
        <label for="CIN">CIN (ID Number)</label>
        <input
          type="number"
          id="CIN"
          class="form-control"
          formControlName="CIN"
          [class.is-invalid]="submitted && f['CIN'].errors"
          placeholder="Enter your CIN"
        />
        <div *ngIf="submitted && f['CIN'].errors" class="invalid-feedback">
          <div *ngIf="f['CIN'].errors['required']">CIN is required</div>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          class="form-control"
          formControlName="password"
          [class.is-invalid]="submitted && f['password'].errors"
          placeholder="Enter a strong password"
        />
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <div *ngIf="f['password'].errors['required']">Password is required</div>
          <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
        </div>
      </div>

      <!-- Role -->
      <div class="form-group">
        <label for="role">Role</label>
        <select
          id="role"
          class="form-control"
          formControlName="role"
          [class.is-invalid]="submitted && f['role'].errors"
        >
          <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
        </select>
        <div *ngIf="submitted && f['role'].errors" class="invalid-feedback">
          <div *ngIf="f['role'].errors['required']">Role is required</div>
        </div>
      </div>

      <!-- Photo (Optional) -->
      <div class="form-group">
        <label for="photo">Photo URL (Optional)</label>
        <input
          type="text"
          id="photo"
          class="form-control"
          formControlName="photo"
          placeholder="Enter photo URL"
        />
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary w-100"
        [disabled]="loading"
      >
        <span *ngIf="loading" class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>
        {{ loading ? 'Registering...' : 'Register' }}
      </button>
    </form>

    <div class="text-center mt-3">
      <p>Already have an account? <a href="/login">Login here</a></p>
    </div>
  </div>
</div>
