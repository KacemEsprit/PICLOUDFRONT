<div style="border-radius:12px; overflow:hidden; border:2px solid #e3f2fd;">
  <div style="padding:15px; background:#f8f9ff;">
    <label style="font-weight:600; color:#1a237e; margin-bottom:10px; display:block;">
      📍 Select Governorate
    </label>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      <span *ngFor="let gov of governorates"
            (click)="selectGovernorate(gov)"
            [style.background]="selectedGovernorate === gov ? '#1a73e8' : '#e3f2fd'"
            [style.color]="selectedGovernorate === gov ? 'white' : '#1a73e8'"
            style="padding:5px 12px; border-radius:20px; font-size:0.8rem;
                   cursor:pointer; font-weight:500; transition:all 0.2s ease;">
        {{ gov }}
      </span>
    </div>
  </div>

  <div style="width:100%; height:300px; overflow:hidden; position:relative;">
    <iframe *ngIf="mapUrl"
            [src]="mapUrl"
            style="position:absolute; top:0; left:0;
                   width:100%; height:100%; border:none;"
            loading="lazy">
    </iframe>
    <div *ngIf="!mapUrl"
         style="height:300px; display:flex; align-items:center;
                justify-content:center; color:#999; background:#f8f9ff;">
      Select a governorate to see the map
    </div>
  </div>
</div>
