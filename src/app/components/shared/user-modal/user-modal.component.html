<div class="modal-fade" *ngIf="isOpen" (click)="closeModal()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h3>{{ title }}</h3>
        <p class="subtitle">Create or update a user profile with secure access controls.</p>
      </div>
      <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
    </div>

    <div class="modal-body">
      <div class="avatar-upload-card">
        <div class="avatar-preview" [ngStyle]="{ 'background-image': avatarPreview ? 'url(' + avatarPreview + ')' : 'none' }">
          <div class="avatar-empty" *ngIf="!avatarPreview">
            <i class="bi bi-person-circle"></i>
          </div>
        </div>
        <div>
          <label class="btn btn-sm btn-outline-primary mb-2" for="photoUpload">
            <i class="bi bi-cloud-upload"></i>
            Upload photo
          </label>
          <input id="photoUpload" type="file" accept="image/*" hidden (change)="onFileSelected($event)" />
          <div class="upload-dropzone" (drop)="onDrop($event)" (dragover)="onDragOver($event)">
            <span>Drag & drop a profile photo here</span>
          </div>
          <small class="text-danger" *ngIf="fileError">{{ fileError }}</small>
        </div>
      </div>

      <form [formGroup]="form" class="user-form-grid user-form-3col" (ngSubmit)="submit()">
        <div class="form-floating">
          <input id="username" type="text" class="form-control" formControlName="username" placeholder="Username" />
          <label for="username">Username</label>
          <small class="text-danger" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
            Username is required and must be at least 3 characters.
          </small>
        </div>

        <div class="form-floating">
          <input id="email" type="email" class="form-control" formControlName="email" placeholder="Email" />
          <label for="email">Email address</label>
          <small class="text-danger" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            Please enter a valid email address.
          </small>
        </div>

        <div class="form-floating">
          <input id="name" type="text" class="form-control" formControlName="name" placeholder="Full Name" />
          <label for="name">Full name</label>
          <small class="text-danger" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
            Full name is required.
          </small>
        </div>

        <div class="form-floating">
          <input id="cin" type="text" class="form-control" formControlName="cin" placeholder="CIN" />
          <label for="cin">CIN (National ID)</label>
        </div>

        <div class="form-floating" *ngIf="passwordFieldVisible">
          <input id="password" type="password" class="form-control" formControlName="password" placeholder="Password" (input)="onPasswordInput($any($event.target).value)" />
          <label for="password">Password</label>
          <div class="password-strength">
            <div class="strength-bar" [style.width.%]="passwordStrength"></div>
          </div>
          <small class="text-muted">Create a secure password for the new user.</small>
        </div>

        <div class="form-floating">
          <select id="role" class="form-select" formControlName="role">
            <option value="ADMIN">Administrator</option>
            <option value="USER">User</option>
            <option value="AGENT">Agent</option>
            <option value="OPERATOR">Operator</option>
          </select>
          <label for="role">Role</label>
        </div>

        <div class="form-check toggle-switch">
          <input id="enabledSwitch" type="checkbox" class="form-check-input" formControlName="enabled" />
          <label class="form-check-label" for="enabledSwitch">Account active</label>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary" (click)="closeModal()" [disabled]="loading">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ mode === 'create' ? 'Create user' : 'Save changes' }}
      </button>
    </div>
  </div>
</div>
